<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="430" fill="#fff"/>
  <!-- usuarios -->
  <rect x="20" y="20" width="270" height="200" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="20" y="20" width="270" height="26" rx="6" fill="#6366f1"/>
  <text x="155" y="38" text-anchor="middle" fill="#fff" font-weight="bold">usuarios</text>
  <g font-size="11"><text x="30" y="64">id (PK)</text><text x="30" y="80">nome, email (UNIQUE), senha_hash</text><text x="30" y="96">role (admin / titular / membro)</text>
  <text x="30" y="118" fill="#7c3aed">plano (free / pro)</text><text x="30" y="134" fill="#7c3aed">stripe_customer_id</text><text x="30" y="150" fill="#7c3aed">stripe_subscription_id</text>
  <text x="30" y="166" fill="#7c3aed">subscription_status, subscription_price_id</text><text x="30" y="182" fill="#7c3aed">subscription_current_period_end</text><text x="30" y="204">foto_perfil, bio, criado_em</text></g>
  <!-- contas -->
  <rect x="340" y="20" width="240" height="140" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="340" y="20" width="240" height="26" rx="6" fill="#2563eb"/>
  <text x="460" y="38" text-anchor="middle" fill="#fff" font-weight="bold">contas</text>
  <g font-size="11"><text x="350" y="64">id (PK)</text><text x="350" y="80">nome, tipo (pessoal / conjunta), saldo</text><text x="350" y="96">criador_id (FK usuarios.id)</text><text x="350" y="112">codigo_convite (UNIQUE)</text><text x="350" y="128">criado_em</text></g>
  <!-- membros -->
  <rect x="340" y="200" width="240" height="110" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="340" y="200" width="240" height="26" rx="6" fill="#2563eb"/>
  <text x="460" y="218" text-anchor="middle" fill="#fff" font-weight="bold">membros_conta</text>
  <g font-size="11"><text x="350" y="244">id (PK)</text><text x="350" y="260">conta_id (FK contas.id)</text><text x="350" y="276">usuario_id (FK usuarios.id)</text><text x="350" y="292">papel (titular / membro), UNIQUE(conta, usuario)</text></g>
  <!-- transacoes -->
  <rect x="630" y="20" width="250" height="230" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="630" y="20" width="250" height="26" rx="6" fill="#16a34a"/>
  <text x="755" y="38" text-anchor="middle" fill="#fff" font-weight="bold">transacoes</text>
  <g font-size="11"><text x="640" y="64">id (PK)</text><text x="640" y="80">conta_id (FK contas.id)</text><text x="640" y="96">usuario_id (FK usuarios.id)</text><text x="640" y="112">categoria_id (FK categorias.id)</text>
  <text x="640" y="132">tipo (despesa / receita), titulo, valor</text><text x="640" y="148">data_transacao, descricao, status</text><text x="640" y="164">comprovante_url, comprovante_nome (MinIO)</text><text x="640" y="180">criado_em, atualizado_em</text></g>
  <!-- categorias -->
  <rect x="630" y="290" width="250" height="100" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <rect x="630" y="290" width="250" height="26" rx="6" fill="#d97706"/>
  <text x="755" y="308" text-anchor="middle" fill="#fff" font-weight="bold">categorias</text>
  <g font-size="11"><text x="640" y="334">id (PK)</text><text x="640" y="350">nome, tipo (despesa / receita)</text><text x="640" y="366">icone, cor</text></g>
  <!-- stripe_events -->
  <rect x="20" y="270" width="270" height="90" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="20" y="270" width="270" height="26" rx="6" fill="#7c3aed"/>
  <text x="155" y="288" text-anchor="middle" fill="#fff" font-weight="bold">stripe_events (idempotencia)</text>
  <g font-size="11"><text x="30" y="314">id (PK) = evt_... do Stripe</text><text x="30" y="330">tipo, processado_em</text></g>
  <!-- relacoes -->
  <g stroke="#444" fill="none" marker-end="url(#a)">
    <line x1="340" y1="90" x2="290" y2="90"/>
    <line x1="340" y1="250" x2="290" y2="150"/>
    <line x1="460" y1="200" x2="460" y2="160"/>
    <line x1="630" y1="90" x2="580" y2="90"/>
    <line x1="630" y1="150" x2="290" y2="170"/>
    <line x1="755" y1="250" x2="755" y2="290"/>
  </g>
  <text x="20" y="410" font-size="11" fill="#555">Setas apontam da chave estrangeira para a tabela referenciada. Colunas em roxo ligam o usuario ao plano e a assinatura do Stripe.</text>
</svg>

