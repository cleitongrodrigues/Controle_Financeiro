<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="420" fill="#fff"/>
  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="10" width="150" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="95" y="32">Usuario</text>
    <rect x="260" y="10" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="335" y="32">Backend</text>
    <rect x="500" y="10" width="150" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="575" y="32">Stripe</text>
    <rect x="740" y="10" width="140" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="810" y="32">MySQL</text>
  </g>
  <g stroke="#bbb" stroke-dasharray="3 3">
    <line x1="95" y1="44" x2="95" y2="410"/><line x1="335" y1="44" x2="335" y2="410"/>
    <line x1="575" y1="44" x2="575" y2="410"/><line x1="810" y1="44" x2="810" y2="410"/>
  </g>
  <g stroke="#444" fill="none" marker-end="url(#a)">
    <line x1="95" y1="75" x2="335" y2="75"/>
    <line x1="335" y1="105" x2="575" y2="105"/>
    <line x1="575" y1="135" x2="95" y2="135"/>
    <line x1="95" y1="165" x2="575" y2="165"/>
    <line x1="575" y1="205" x2="335" y2="205"/>
    <line x1="335" y1="235" x2="810" y2="235"/>
    <line x1="95" y1="275" x2="335" y2="275"/>
    <line x1="335" y1="305" x2="810" y2="305"/>
    <line x1="95" y1="345" x2="575" y2="345"/>
    <line x1="575" y1="375" x2="335" y2="375"/>
  </g>
  <g font-size="11">
    <text x="105" y="70">1. clica "Assinar Pro" (POST /api/stripe/checkout-session)</text>
    <text x="345" y="100">2. cria Customer + Checkout Session (mode=subscription)</text>
    <text x="110" y="130">3. URL do checkout hospedado pelo Stripe</text>
    <text x="105" y="160">4. paga com cartao de teste 4242 (dados nao passam pelo servidor)</text>
    <text x="345" y="200">5. webhook checkout.session.completed (assinatura validada)</text>
    <text x="345" y="230">6. grava evento em stripe_events; se ja existe, ignora (idempotencia)</text>
    <text x="520" y="250" fill="#166534">UPDATE usuarios SET plano='pro', status='active'</text>
    <text x="105" y="270">7. proxima requisicao: POST /api/transacoes</text>
    <text x="345" y="300">8. le plano no banco a cada requisicao: Pro sem limite, Free ate 3/mes</text>
    <text x="105" y="340">9. "Gerenciar" abre o portal do cliente e o usuario cancela</text>
    <text x="345" y="370">10. webhook customer.subscription.deleted  volta para plano free</text>
  </g>
</svg>

