<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="560" fill="#fff"/>
  <!-- navegador -->
  <rect x="330" y="10" width="240" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="450" y="30" text-anchor="middle" font-weight="bold">Navegador</text>
  <text x="450" y="46" text-anchor="middle" font-size="11">cliente final (HTTPS)</text>
  <line x1="450" y1="56" x2="450" y2="90" stroke="#444" marker-end="url(#a)"/>
  <text x="458" y="78" font-size="11">cleiton-souza-isw055.lapps.studio</text>

  <!-- rede docker -->
  <rect x="20" y="95" width="860" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="32" y="114" font-size="12" fill="#475569">Stack Portainer "filmes-do-cleitin" - rede Docker conta-comigo-network (VM)</text>

  <rect x="330" y="125" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="147" text-anchor="middle" font-weight="bold">Frontend (React + Nginx)</text>
  <text x="450" y="165" text-anchor="middle" font-size="11">porta 8201 - PUBLICO</text>

  <line x1="450" y1="181" x2="450" y2="215" stroke="#444" marker-end="url(#a)"/>
  <text x="458" y="203" font-size="11">/api/*</text>

  <rect x="300" y="218" width="300" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="240" text-anchor="middle" font-weight="bold">Backend (Node.js / Express)</text>
  <text x="450" y="258" text-anchor="middle" font-size="11">porta 3000 - CRUD, multi-tenancy, limites do plano,</text>
  <text x="450" y="274" text-anchor="middle" font-size="11">upload, webhook do Stripe</text>

  <rect x="40" y="235" width="190" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="135" y="257" text-anchor="middle" font-weight="bold">auth-service</text>
  <text x="135" y="275" text-anchor="middle" font-size="11">3001 - login, JWT, RBAC (interno)</text>
  <line x1="300" y1="256" x2="230" y2="260" stroke="#444" marker-end="url(#a)"/>

  <rect x="670" y="235" width="190" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="765" y="257" text-anchor="middle" font-weight="bold">log-service</text>
  <text x="765" y="275" text-anchor="middle" font-size="11">3002 - auditoria (interno)</text>
  <line x1="600" y1="256" x2="670" y2="260" stroke="#444" marker-end="url(#a)"/>

  <rect x="670" y="350" width="190" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="765" y="372" text-anchor="middle" font-weight="bold">Redis 7</text>
  <text x="765" y="390" text-anchor="middle" font-size="11">Redis Streams (interno)</text>
  <line x1="765" y1="291" x2="765" y2="350" stroke="#444" marker-end="url(#a)"/>
  <text x="773" y="326" font-size="11">XADD</text>

  <rect x="300" y="350" width="300" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="372" text-anchor="middle" font-weight="bold">MinIO (S3)</text>
  <text x="450" y="390" text-anchor="middle" font-size="11">comprovantes (interno, sem porta publicada)</text>
  <line x1="450" y1="294" x2="450" y2="350" stroke="#444" marker-end="url(#a)"/>

  <!-- externos -->
  <rect x="40" y="480" width="330" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="205" y="502" text-anchor="middle" font-weight="bold">MySQL (servidor externo)</text>
  <text x="205" y="520" text-anchor="middle" font-size="11">DB_HOST:3306 - usuarios, contas, transacoes...</text>

  <rect x="530" y="480" width="330" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="695" y="502" text-anchor="middle" font-weight="bold">Stripe (SaaS externo, modo teste)</text>
  <text x="695" y="520" text-anchor="middle" font-size="11">checkout, portal do cliente, webhooks</text>

  <path d="M380 294 L205 480" stroke="#444" fill="none" marker-end="url(#a)"/>
  <path d="M135 291 L135 480" stroke="#444" fill="none" marker-end="url(#a)"/>
  <path d="M560 294 L640 480" stroke="#444" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <path d="M740 480 L560 294" stroke="#444" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="640" y="440" font-size="11" fill="#475569">webhook (POST /api/stripe/webhook)</text>
</svg>

